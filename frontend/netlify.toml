# Netlify build config for the frontend (run from the frontend/ directory,
# or set "Base directory" = frontend in the Netlify UI).
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so client-side anchors / refreshes resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
